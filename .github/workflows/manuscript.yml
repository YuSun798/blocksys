name: Compile BlockSys 2027 revised manuscript
on:
  push:
    paths:
      - 'main.tex'
      - 'llncs.cls'
      - 'figures/**'
      - 'experiments/**'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify revised manuscript root
        run: |
          test -s main.tex
          grep -Fq 'Cross-Layer Privacy Compilation for Decentralized LLM Inference' main.tex
          grep -Fq 'Matched Rewrite and Island Ablation' main.tex
          grep -Fq 'version 2.25' llncs.cls
      - name: Compile Springer LNCS manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Verify page limit and reproducible evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 experiments/loopback_2pc.py --trials 3 --warmup 1 --output "$RUNNER_TEMP/loopback-smoke"
          python3 experiments/figure_data.py --check
          python3 experiments/check_manuscript_evidence.py main.pdf
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: blocksys-2027-revised-paper
          path: main.pdf

name: Compile BlockSys 2027 revised manuscript
on:
  push:
    paths:
      - 'main.tex'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify revised manuscript root
        run: |
          test -s main.tex
          grep -q 'Rewrite Before You Share' main.tex
          grep -q 'CPU Diagnostic' main.tex
      - name: Compile Springer LNCS manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: blocksys-2027-revised-paper
          path: main.pdf

name: Compile BlockSys 2027 revised manuscript
on:
  push:
    paths:
      - 'main.tex'
      - 'llncs.cls'
      - 'figures/**'
      - 'experiments/**'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify revised manuscript root
        run: |
          test -s main.tex
          grep -Fq 'Compiling a Task Rewrite into Protected Pythia' main.tex
          grep -Fq 'version 2.25' llncs.cls
      - name: Compile Springer LNCS manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -halt-on-error
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify page limit and reproducible evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 -m pip install numpy==2.0.2
          python3 experiments/smoke_pythia_protocols.py
          python3 experiments/loopback_2pc.py --trials 3 --warmup 1 --output "$RUNNER_TEMP/loopback-smoke"
          python3 experiments/network_sensitivity.py --check
          python3 experiments/delay_sweep.py --check --output experiments/results
          python3 experiments/check_cross_layer_evidence.py experiments/results/cross_layer_rewrite_cases.csv --summary experiments/results/cross_layer_rewrite_summary.json --transport tcp
          python3 experiments/check_cross_layer_scale.py experiments/results/cross_layer_scale_cases.csv --summary experiments/results/cross_layer_scale_summary.json --transport tcp --compare-cases experiments/results/cross_layer_scale_160m_cases.csv --compare-summary experiments/results/cross_layer_scale_160m_summary.json
          python3 experiments/layout_quality_gate.py experiments/results/cross_layer_scale_cases.csv
          python3 experiments/layout_quality_gate.py experiments/results/cross_layer_scale_160m_cases.csv
          python3 experiments/check_layout_quality_gate.py experiments/results --transport tcp
          python3 experiments/check_sst2_layout.py experiments/results --require-full-tcp
          python3 experiments/figure_data.py --check
          python3 experiments/check_manuscript_evidence.py main.pdf
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: blocksys-2027-revised-paper
          path: main.pdf
